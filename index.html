<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050708">
  <meta name="description" content="Major Marketing JA — Something major is coming.">
  <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <title>Major Marketing JA — Coming Soon</title>
  <style>
    :root{--teal:#13c2c0;--pink:#ee2a91;--ink:#050708;--white:#f7f4f2;--muted:#b9b7b9}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink)}body{font-family:Arial,Helvetica,sans-serif;color:var(--white)}.page{min-height:100vh;min-height:100svh;display:grid;place-items:center;position:relative;overflow:hidden;padding:48px 24px;background:radial-gradient(circle at 12% 14%,rgba(19,194,192,.16),transparent 30%),radial-gradient(circle at 88% 86%,rgba(238,42,145,.16),transparent 30%),var(--ink)}.page:before{content:"";position:absolute;inset:0;opacity:.16;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 84%)}.shell{width:min(100%,760px);position:relative;z-index:1;text-align:center;display:flex;flex-direction:column;align-items:center}.social{position:absolute;top:28px;right:28px;color:#e3d9df;display:inline-flex;transition:color .2s,transform .2s}.social:hover{color:var(--pink);transform:translateY(-2px)}.social:focus-visible{outline:2px solid var(--teal);outline-offset:5px}.social svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.kicker{margin:0 0 26px;color:var(--teal);font-size:11px;font-weight:700;letter-spacing:.34em;text-transform:uppercase}.logo{width:min(100%,310px);height:auto;display:block;margin:0 auto 38px;filter:drop-shadow(0 18px 36px rgba(0,0,0,.5))}.rule{width:74px;height:2px;margin:0 auto 27px;background:linear-gradient(90deg,var(--teal),var(--pink))}.title{margin:0;font-size:clamp(42px,8vw,84px);font-weight:800;letter-spacing:-.045em;line-height:.93;text-transform:uppercase}.title em{font-style:normal;color:var(--pink)}.cta{margin-top:34px;display:inline-flex;align-items:center;gap:10px;padding:14px 20px;border:1px solid rgba(238,42,145,.7);color:#fff;text-decoration:none;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;transition:background .2s,border-color .2s,transform .2s}.cta:hover{background:rgba(238,42,145,.16);border-color:var(--teal);transform:translateY(-2px)}.cta:focus-visible{outline:2px solid var(--teal);outline-offset:4px}.cta svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}@media(max-width:520px){.page{padding:40px 20px}.social{top:18px;right:18px}.kicker{font-size:9px;letter-spacing:.24em;margin-bottom:20px}.logo{width:min(100%,250px);margin-bottom:30px}.cta{margin-top:27px;min-height:44px}}
  </style>
</head>
<body>
  <main class="page">
    <div class="shell">
      <a class="social" href="https://www.instagram.com/majormarketingja/" target="_blank" rel="noopener noreferrer" aria-label="Follow Major Marketing JA on Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r=".8" fill="currentColor" stroke="none"></circle></svg>
      </a>
      <p class="kicker">Romeich Entertainment presents</p>
      <img class="logo" src="./major-marketing-logo-transparent.png" alt="Major Marketing" width="800" height="800">
      <div class="rule" aria-hidden="true"></div>
      <h1 class="title">Something <em>major</em><br>is coming.</h1>
      <a class="cta" href="https://www.instagram.com/majormarketingja/" target="_blank" rel="noopener noreferrer">Follow the movement <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13"></path><path d="m13 6 6 6-6 6"></path></svg></a>
    </div>
  </main>
</body>
</html>
